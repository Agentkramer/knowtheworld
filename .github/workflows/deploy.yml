name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # TRMNL only re-renders a polling plugin when the fetched payload changes
  # ("if the data has not changed then the screen will not be generated"). Our
  # trmnl/data.json is static, so without this it would never refresh and the
  # "country of the day" would freeze until a manual Force Refresh. Rebuilding on
  # a schedule re-stamps data.json's `tick` heartbeat (AM/PM per UTC day), which
  # is the change that lets TRMNL regenerate the screen. Twice daily (00:05 and
  # 12:05 UTC): the midnight run flips the country for the eastern hemisphere in
  # its morning, the midday run does the same for the Americas — and it doubles
  # as a retry if one run fails. The country itself still changes once per local
  # day (the shared markup derives it from the account timezone's `now`).
  schedule:
    - cron: "5 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Re-stamp trmnl/data.json with today's date (self-contained: reads only
      # committed src/data + src/i18n.ts, no external APIs) so each deploy —
      # scheduled or on push — publishes a payload that differs from yesterday's.
      - run: node scripts/build-trmnl.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
