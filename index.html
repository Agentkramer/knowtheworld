<!doctype html>
<html lang="en" data-theme="atlas">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="One country at a time — learn every country, flag and capital. A random country on every visit, plus search, a sortable list and a quiz, in five languages." />
    <link rel="canonical" href="https://www.knowtheworld.net/" />
    <title>Know the World — one country at a time</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Know the World" />
    <meta property="og:title" content="Know the World — one country at a time" />
    <meta property="og:description" content="A random country on every visit — flag, capital, location on the map and more. Search, a sortable list and a quiz, in five languages." />
    <meta property="og:url" content="https://www.knowtheworld.net/" />
    <meta property="og:image" content="https://www.knowtheworld.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Know the World — one country at a time" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Know the World — one country at a time" />
    <meta name="twitter:description" content="A random country on every visit — flag, capital, location on the map and more. In five languages." />
    <meta name="twitter:image" content="https://www.knowtheworld.net/og.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="masthead">
        <a class="brand" href="#" id="brand">
          <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="var(--accent)" />
            <g stroke="var(--bg)" stroke-width="1.6" fill="none" stroke-linecap="round">
              <line x1="3" y1="20" x2="37" y2="20" />
              <path d="M20 2 C29 8 29 32 20 38" />
              <path d="M20 2 C11 8 11 32 20 38" />
              <path d="M20 2 C24.5 8 24.5 32 20 38" />
              <path d="M20 2 C15.5 8 15.5 32 20 38" />
              <path d="M6.5 11 H33.5" />
              <path d="M6.5 29 H33.5" />
            </g>
          </svg>
          <span class="brand-text">
            <span class="brand-name">Know the World</span>
            <span class="brand-tagline">One country at a time.</span>
          </span>
        </a>
        <p class="intro" id="intro"><span id="intro-text"></span><a href="./ueber.html" id="intro-more"></a></p>
      </div>

      <div class="header-right">
        <div class="controls">
          <div class="search" id="search-box">
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search a country…"
              aria-label="Search a country"
            />
            <ul id="search-results" hidden></ul>
          </div>
          <div class="picker" id="lang-picker">
            <button type="button" id="lang-button" class="picker-button" aria-haspopup="listbox" aria-expanded="false">
              <img id="lang-flag" alt="" />
              <span id="lang-code">EN</span>
              <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 4.5 6 8l3.5-3.5" />
              </svg>
            </button>
            <ul id="lang-menu" class="picker-menu" role="listbox" hidden></ul>
          </div>
          <div class="picker" id="theme-picker">
            <button type="button" id="theme-button" class="picker-button" aria-haspopup="listbox" aria-expanded="false">
              <span class="swatch" id="theme-swatch" aria-hidden="true"></span>
              <span id="theme-name">Atlas</span>
              <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.5 4.5 6 8l3.5-3.5" />
              </svg>
            </button>
            <ul id="theme-menu" class="picker-menu" role="listbox" hidden></ul>
          </div>
        </div>

        <nav class="toolbar" id="toolbar">
          <div class="bar-buttons">
            <div class="mode-switch" id="mode-switch"></div>
            <button id="random-btn" class="random-btn" type="button">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
                <circle cx="8.6" cy="8.6" r="1.4" fill="currentColor" stroke="none"/>
                <circle cx="15.4" cy="8.6" r="1.4" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
                <circle cx="8.6" cy="15.4" r="1.4" fill="currentColor" stroke="none"/>
                <circle cx="15.4" cy="15.4" r="1.4" fill="currentColor" stroke="none"/>
              </svg>
              <span id="random-label">Surprise me</span>
            </button>
          </div>
          <p class="progress">
            <span id="progress"></span>
            <button id="reset-btn" class="reset-btn" type="button" aria-label="Reset">
              <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5"/>
                <path d="M3.5 3.5v5h5"/>
              </svg>
            </button>
          </p>
        </nav>
      </div>
    </header>

    <main id="app"></main>

    <footer class="site-footer">
      <p class="footer-legal">
        <a href="./ueber.html" id="link-about">Über</a> ·
        <a href="./impressum.html" id="link-imprint">Impressum</a> ·
        <a href="./datenschutz.html" id="link-privacy">Datenschutz</a>
      </p>
      <p>
        Data: <a href="https://www.wikidata.org" rel="noopener">Wikidata</a> ·
        <a href="https://github.com/mledoze/countries" rel="noopener">world-countries</a> ·
        <a href="https://github.com/lipis/flag-icons" rel="noopener">flag-icons</a>
        · <span id="data-stamp"></span>
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
