<!doctype html>
<html lang="en" data-theme="atlas">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="One country at a time — learn every country, flag and capital." />
    <title>Know the World</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Know the World</span>
      </a>
      <div class="controls">
        <div class="search" id="search-box">
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search a country…"
            aria-label="Search a country"
          />
          <ul id="search-results" hidden></ul>
        </div>
        <select id="lang-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="fr">FR</option>
          <option value="it">IT</option>
          <option value="es">ES</option>
        </select>
        <select id="theme-select" aria-label="Theme">
          <option value="atlas">Atlas</option>
          <option value="swiss">Swiss</option>
          <option value="dark">Nocturne</option>
          <option value="vintage">Vintage</option>
        </select>
      </div>
    </header>

    <main id="app"></main>

    <div class="random-bar">
      <div class="bar-buttons">
      <button id="random-btn" class="random-btn" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
          <circle cx="8.6" cy="8.6" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="15.4" cy="8.6" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="8.6" cy="15.4" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="15.4" cy="15.4" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
        <span id="random-label">Surprise me</span>
      </button>
      <div class="mode-switch" id="mode-switch"></div>
      </div>
      <p class="progress">
        <span id="progress"></span>
        <button id="reset-btn" class="reset-btn" type="button" aria-label="Reset">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.5-6L3.5 8.5"/>
            <path d="M3.5 3.5v5h5"/>
          </svg>
        </button>
      </p>
    </div>

    <footer class="site-footer">
      <p>
        Data: <a href="https://www.wikidata.org" rel="noopener">Wikidata</a> ·
        <a href="https://github.com/mledoze/countries" rel="noopener">world-countries</a> ·
        <a href="https://github.com/lipis/flag-icons" rel="noopener">flag-icons</a>
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
