---
# Know the World — TRMNL private plugin (uploaded to TRMNL).
name: Know the World — Country of the Day
framework_version: latest

# Polling: TRMNL fetches our static JSON on a schedule (no server needed).
# The file is ~59 KB — well under TRMNL's ~100 KB polling ceiling.
#
# Data + asset dependency (all served from the same origin, www.knowtheworld.net,
# a static GitHub Pages site maintained alongside this plugin):
#   /trmnl/data.json          the polled payload: { generated, count, countries[] },
#                             each country = { c2, c3, n{5 langs}, cap{5 langs},
#                             r, sr, pop, area, founded, terr }
#   /trmnl/basemap.svg        static world map, shared by every country
#   /trmnl/maps/<cca3>.svg    per-country overlay (outline + location marker)
#   /favicon.svg              title-bar icon
# The maps are deliberately served as cacheable static assets rather than inlined,
# to keep the polled payload small. If the host is unreachable the layouts still
# render (text + fallback); only the map graphics would be missing.
strategy: polling
polling_verb: GET
polling_url: https://www.knowtheworld.net/trmnl/data.json
polling_headers: ''
# Content rotates once per calendar day, so a daily refresh is plenty and keeps
# the device's battery happy. (Allowed: 15 | 60 | 360 | 720 | 1440 minutes.)
refresh_interval: 1440

no_screen_padding: 'no'
dark_mode: 'no'

custom_fields:
- keyname: lang
  name: Language
  field_type: select
  description: Language for country names, capitals and labels.
  options:
  - English: en
  - Deutsch: de
  - Français: fr
  - Italiano: it
  - Español: es
  default: en

# Author / support block shown below the plugin on the marketplace.
# NOTE: personalize the description (and add github_url / email_address if you
# want them shown as clickable icons).
- keyname: about
  name: About this plugin
  field_type: author_bio
  description: >-
    A new country every day — its place on the world map, capital, population,
    area and region, in English, German, French, Italian or Spanish. Built on
    the open geography data behind Know the World (world-countries, Wikidata,
    Natural Earth). The daily data and the map graphics are served as static
    files from www.knowtheworld.net; nothing is tracked and no account is needed.
  learn_more_url: https://www.knowtheworld.net
